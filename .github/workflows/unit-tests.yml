name: Unit tests

on:
  pull_request:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "**/*.md"
      - ".env.example"
      - "LICENSE"
      - "docs/**"
      - ".github/actions/detect-source-changes/action.yml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/code-quality.yml"
      - ".github/workflows/documentation.yml"

permissions:
  contents: read

jobs:
  changes:
    name: Detect source changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: filter
        uses: ./.github/actions/detect-source-changes
        with:
          base-sha: ${{ github.event.pull_request.base.sha || github.event.before }}
          head-sha: ${{ github.sha }}

  documentation-unit-statuses:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.code != 'true'
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-latest / gcc
          - name: ubuntu-latest / clang
          - name: windows-latest / msvc
          - name: macos-latest / appleclang
          - name: minimum / gcc-13
          - name: minimum / clang-16
          - name: minimum / appleclang-xcode-15.4

    steps:
      - name: Report documentation-only change
        run: echo "No source code changed; this required test status replaces the skipped build."

  documentation-driver-statuses:
    name: Optional drivers / ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.code != 'true'
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        name:
          - no drivers
          - SQLite only
          - PostgreSQL only
          - MySQL only
          - MSSQL only

    steps:
      - name: Report documentation-only change
        run: echo "No source code changed; this required driver status replaces the skipped build."

  unit-tests:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-latest / gcc
            os: ubuntu-24.04
            compiler: gcc
            cc: gcc-14
            cxx: g++-14
            packages: gcc-14 g++-14
          - name: ubuntu-latest / clang
            os: ubuntu-24.04
            compiler: clang
            cc: clang-18
            cxx: clang++-18
            packages: clang-18
          - name: windows-latest / msvc
            os: windows-2022
            compiler: msvc
            toolset: version=14.44
          - name: macos-latest / appleclang
            os: macos-15
            compiler: appleclang
            cc: clang
            cxx: clang++
            xcode: /Applications/Xcode_16.4.app
          - name: minimum / gcc-13
            os: ubuntu-24.04
            compiler: gcc
            cc: gcc-13
            cxx: g++-13
            packages: gcc-13 g++-13
          - name: minimum / clang-16
            os: ubuntu-24.04
            compiler: clang
            cc: clang-16
            cxx: clang++-16
            packages: clang-16
          - name: minimum / appleclang-xcode-15.4
            os: macos-14
            compiler: appleclang
            cc: clang
            cxx: clang++
            xcode: /Applications/Xcode_15.4.app

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install MySQL client development files
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf autoconf-archive automake default-libmysqlclient-dev libtool pkg-config ${{ matrix.packages }}

      - name: Install MySQL client development files
        if: runner.os == 'macOS'
        run: |
          brew install autoconf autoconf-archive automake libtool mysql-client pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix mysql-client)/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

      - name: Select Xcode
        if: runner.os == 'macOS'
        run: sudo xcode-select --switch "${{ matrix.xcode }}/Contents/Developer"

      - name: Report compiler version
        if: runner.os != 'Windows'
        run: ${{ matrix.cxx }} --version

      - name: Bootstrap vcpkg
        if: runner.os != 'Windows'
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh"

      - name: Bootstrap vcpkg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat"

      - name: Configure
        if: runner.os == 'Windows'
        run: >
          cmake -S . -B build
          -DBUILD_TESTING=ON
          -DWORM_ENABLE_POSTGRESQL=OFF
          -DWORM_ENABLE_MYSQL=ON
          -DWORM_ENABLE_SQLITE=ON
          -DWORM_WARNINGS_AS_ERRORS=ON
          -T "${{ matrix.toolset }}"
          -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake"

      - name: Configure
        if: runner.os != 'Windows'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER="${{ matrix.cc }}"
          -DCMAKE_CXX_COMPILER="${{ matrix.cxx }}"
          -DBUILD_TESTING=ON
          -DWORM_WARNINGS_AS_ERRORS=ON
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Run unit tests
        run: ctest --test-dir build -C Debug --output-on-failure

  driver-contracts:
    name: Driver contracts
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: worm_contract
          POSTGRES_USER: worm
          POSTGRES_PASSWORD: worm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U worm -d worm_contract"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: worm_contract
          MYSQL_USER: worm
          MYSQL_PASSWORD: worm
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: WormTest@12345
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'WormTest@12345' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      WORM_TEST_POSTGRES_HOST: 127.0.0.1
      WORM_TEST_POSTGRES_PORT: 5432
      WORM_TEST_POSTGRES_DBNAME: worm_contract
      WORM_TEST_POSTGRES_USERNAME: worm
      WORM_TEST_POSTGRES_PASSWORD: worm
      WORM_TEST_MYSQL_HOST: 127.0.0.1
      WORM_TEST_MYSQL_PORT: 3306
      WORM_TEST_MYSQL_DBNAME: worm_contract
      WORM_TEST_MYSQL_USERNAME: worm
      WORM_TEST_MYSQL_PASSWORD: worm
      WORM_TEST_MSSQL_HOST: 127.0.0.1
      WORM_TEST_MSSQL_PORT: 1433
      WORM_TEST_MSSQL_DBNAME: worm_test
      WORM_TEST_MSSQL_USERNAME: sa
      WORM_TEST_MSSQL_PASSWORD: WormTest@12345

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install database client development files
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf autoconf-archive automake curl default-libmysqlclient-dev libtool pkg-config
          curl -sSL -O "https://packages.microsoft.com/config/ubuntu/$(. /etc/os-release && echo "$VERSION_ID")/packages-microsoft-prod.deb"
          sudo dpkg -i packages-microsoft-prod.deb
          rm packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 mssql-tools18 unixodbc-dev

      - name: Create SQL Server test database
        run: >
          /opt/mssql-tools18/bin/sqlcmd
          -S 127.0.0.1
          -U "$WORM_TEST_MSSQL_USERNAME"
          -P "$WORM_TEST_MSSQL_PASSWORD"
          -C
          -Q "IF DB_ID(N'worm_test') IS NULL CREATE DATABASE [worm_test]"

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh"

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DWORM_ENABLE_POSTGRESQL=ON
          -DWORM_ENABLE_MYSQL=ON
          -DWORM_ENABLE_SQLITE=ON
          -DWORM_ENABLE_MSSQL=ON
          -DWORM_BUILD_CLI=ON
          -DWORM_BUILD_BENCHMARKS=ON
          -DBUILD_TESTING=ON
          -DWORM_WARNINGS_AS_ERRORS=ON
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build driver contracts
        run: >
          cmake --build build --config Debug --parallel --target
          WormSqliteDriverContractTests
          WormSqliteSchemaInspectorTests
          WormPostgresDriverContractTests
          WormMySqlDriverContractTests
          WormMsSqlDriverContractTests
          WormCliMsSqlContractTests
          WormDriverBenchmarks

      - name: Run driver contracts
        run: ctest --test-dir build -C RelWithDebInfo -L driver-contract --output-on-failure

      - name: Measure driver costs
        run: |
          mkdir -p build/benchmark-results
          build/benchmarks/WormDriverBenchmarks sqlite 100 > build/benchmark-results/drivers.csv
          build/benchmarks/WormDriverBenchmarks postgresql 100 | tail -n +2 >> build/benchmark-results/drivers.csv
          build/benchmarks/WormDriverBenchmarks mysql 100 | tail -n +2 >> build/benchmark-results/drivers.csv

          {
            echo '## Driver performance sample'
            echo
            echo 'The statement measurement includes preparation, execution, result decoding, and hydration.'
            echo
            echo '```csv'
            cat build/benchmark-results/drivers.csv
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload driver measurements
        uses: actions/upload-artifact@v4
        with:
          name: worm-driver-benchmarks
          path: build/benchmark-results/drivers.csv
          if-no-files-found: error
          retention-days: 14

  sanitizers:
    name: Sanitizers / ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux ASan + UBSan
            os: ubuntu-latest
            build-type: Debug
          - name: Windows ASan
            os: windows-latest
            build-type: RelWithDebInfo

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf autoconf-archive automake clang libtool

      - name: Bootstrap vcpkg
        if: runner.os == 'Linux'
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh"

      - name: Bootstrap vcpkg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat"

      - name: Configure
        if: runner.os == 'Linux'
        env:
          CC: clang
          CXX: clang++
        run: >
          cmake -S . -B build/sanitizers
          -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}
          -DBUILD_TESTING=ON
          -DWORM_BUILD_CLI=ON
          -DWORM_BUILD_EXAMPLES=ON
          -DWORM_ENABLE_POSTGRESQL=OFF
          -DWORM_ENABLE_MYSQL=OFF
          -DWORM_ENABLE_SQLITE=ON
          -DWORM_ENABLE_SANITIZERS=ON
          -DWORM_WARNINGS_AS_ERRORS=ON
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Configure
        if: runner.os == 'Windows'
        run: >
          cmake -S . -B build/sanitizers
          -DBUILD_TESTING=ON
          -DWORM_BUILD_CLI=ON
          -DWORM_BUILD_EXAMPLES=ON
          -DWORM_ENABLE_POSTGRESQL=OFF
          -DWORM_ENABLE_MYSQL=OFF
          -DWORM_ENABLE_SQLITE=ON
          -DWORM_ENABLE_SANITIZERS=ON
          -DWORM_WARNINGS_AS_ERRORS=ON
          -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build/sanitizers --config ${{ matrix.build-type }} --parallel

      - name: Add MSVC AddressSanitizer runtime to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $visualStudio = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.ASAN -property installationPath
          if (-not $visualStudio) {
            throw "Visual Studio with the AddressSanitizer component was not found."
          }

          $asanRuntime = Get-ChildItem `
            -Path "$visualStudio\VC\Tools\MSVC\*\bin\Hostx64\x64\clang_rt.asan_dynamic-x86_64.dll" `
            -File | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $asanRuntime) {
            throw "The MSVC AddressSanitizer runtime DLL was not found."
          }

          Add-Content -Path $env:GITHUB_PATH -Value $asanRuntime.DirectoryName

      - name: Run Linux sanitizer tests
        if: runner.os == 'Linux'
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build/sanitizers -C ${{ matrix.build-type }} --output-on-failure

      - name: Run Windows sanitizer tests
        if: runner.os == 'Windows'
        env:
          ASAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build/sanitizers -C ${{ matrix.build-type }} --output-on-failure

  coverage:
    name: Coverage / GCC
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf autoconf-archive automake gcovr g++ libtool

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh"

      - name: Configure
        env:
          CC: gcc
          CXX: g++
        run: >
          cmake -S . -B build/coverage
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DWORM_BUILD_CLI=ON
          -DWORM_BUILD_EXAMPLES=ON
          -DWORM_ENABLE_POSTGRESQL=OFF
          -DWORM_ENABLE_MYSQL=OFF
          -DWORM_ENABLE_SQLITE=ON
          -DWORM_ENABLE_COVERAGE=ON
          -DWORM_WARNINGS_AS_ERRORS=ON
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build/coverage --config Debug --parallel

      - name: Run tests
        run: ctest --test-dir build/coverage -C Debug --output-on-failure

      - name: Generate coverage report
        run: |
          mkdir -p build/coverage-report
          gcovr \
            --root . \
            --filter 'src/' \
            --filter 'cli/src/' \
            --exclude 'tests/' \
            --branches \
            --html-details build/coverage-report/index.html \
            --xml build/coverage-report/coverage.xml \
            --txt build/coverage-report/coverage.txt \
            --print-summary

          {
            echo '## Worm coverage'
            echo
            echo '```text'
            cat build/coverage-report/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: worm-coverage
          path: build/coverage-report
          if-no-files-found: error
          retention-days: 14

  fuzzing:
    name: Fuzzing / Clang
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: >
          cmake -S . -B build/fuzz
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DBUILD_TESTING=OFF
          -DWORM_BUILD_FUZZERS=ON
          -DWORM_ENABLE_POSTGRESQL=OFF
          -DWORM_ENABLE_MYSQL=OFF
          -DWORM_ENABLE_SQLITE=OFF
          -DWORM_ENABLE_MSSQL=OFF
          -DWORM_WARNINGS_AS_ERRORS=ON

      - name: Build fuzz target
        run: cmake --build build/fuzz --config RelWithDebInfo --parallel --target WormStatementFuzzer

      - name: Fuzz statements and parameters
        run: >
          build/fuzz/fuzz/WormStatementFuzzer
          fuzz/corpus
          -max_total_time=30
          -timeout=5
          -print_final_stats=1

      - name: Upload failing fuzz input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: worm-fuzz-failure
          path: |
            crash-*
            leak-*
            oom-*
            timeout-*
          if-no-files-found: ignore
          retention-days: 14

  optional-drivers:
    name: Optional drivers / ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no drivers
            cmake-options: >-
              -DWORM_ENABLE_POSTGRESQL=OFF
              -DWORM_ENABLE_MYSQL=OFF
              -DWORM_ENABLE_SQLITE=OFF
          - name: SQLite only
            cmake-options: >-
              -DWORM_ENABLE_POSTGRESQL=OFF
              -DWORM_ENABLE_MYSQL=OFF
              -DWORM_ENABLE_SQLITE=ON
              -DWORM_BUILD_EXAMPLES=ON
          - name: PostgreSQL only
            cmake-options: >-
              -DWORM_ENABLE_POSTGRESQL=ON
              -DWORM_ENABLE_MYSQL=OFF
              -DWORM_ENABLE_SQLITE=OFF
          - name: MySQL only
            cmake-options: >-
              -DWORM_ENABLE_POSTGRESQL=OFF
              -DWORM_ENABLE_MYSQL=ON
              -DWORM_ENABLE_SQLITE=OFF
          - name: MSSQL only
            cmake-options: >-
              -DWORM_ENABLE_POSTGRESQL=OFF
              -DWORM_ENABLE_MYSQL=OFF
              -DWORM_ENABLE_SQLITE=OFF
              -DWORM_ENABLE_MSSQL=ON

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Unix build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf autoconf-archive automake libtool

      - name: Install MySQL client development files
        if: matrix.name == 'MySQL only'
        run: |
          sudo apt-get install -y default-libmysqlclient-dev pkg-config

      - name: Install ODBC development files
        if: matrix.name == 'MSSQL only'
        run: |
          sudo apt-get install -y unixodbc-dev

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh"

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DWORM_WARNINGS_AS_ERRORS=ON
          ${{ matrix.cmake-options }}
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Run tests
        run: ctest --test-dir build -C Debug --output-on-failure
