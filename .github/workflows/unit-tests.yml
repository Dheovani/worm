name: Unit tests

on:
  pull_request:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "**/*.md"
      - ".env.example"
      - "LICENSE"
      - "docs/**"
      - ".github/actions/detect-source-changes/action.yml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/code-quality.yml"
      - ".github/workflows/documentation.yml"
      - ".github/workflows/unit-tests.yml"

permissions:
  contents: read

jobs:
  changes:
    name: Detect source changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: filter
        uses: ./.github/actions/detect-source-changes
        with:
          base-sha: ${{ github.event.pull_request.base.sha || github.event.before }}
          head-sha: ${{ github.sha }}

  documentation-unit-statuses:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    needs: changes
    if: needs.changes.outputs.code != 'true'
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
          - os: ubuntu-latest
            compiler: clang
          - os: windows-latest
            compiler: msvc
          - os: macos-latest
            compiler: appleclang

    steps:
      - name: Report documentation-only change
        run: echo "No source code changed; this required test status replaces the skipped build."

  documentation-driver-statuses:
    name: Optional drivers / ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.code != 'true'
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        name:
          - no drivers
          - SQLite only
          - PostgreSQL only
          - MySQL only
          - MSSQL only

    steps:
      - name: Report documentation-only change
        run: echo "No source code changed; this required driver status replaces the skipped build."

  unit-tests:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
          - os: ubuntu-latest
            compiler: clang
            cc: clang
            cxx: clang++
          - os: windows-latest
            compiler: msvc
          - os: macos-latest
            compiler: appleclang
            cc: clang
            cxx: clang++

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install MySQL client development files
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf autoconf-archive automake default-libmysqlclient-dev libtool pkg-config

      - name: Install MySQL client development files
        if: runner.os == 'macOS'
        run: |
          brew install autoconf autoconf-archive automake libtool mysql-client pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix mysql-client)/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

      - name: Install Clang
        if: runner.os == 'Linux' && matrix.compiler == 'clang'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Bootstrap vcpkg
        if: runner.os != 'Windows'
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh"

      - name: Bootstrap vcpkg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat"

      - name: Configure
        if: runner.os == 'Windows'
        run: >
          cmake -S . -B build
          -DBUILD_TESTING=ON
          -DWORM_ENABLE_POSTGRESQL=OFF
          -DWORM_ENABLE_MYSQL=ON
          -DWORM_ENABLE_SQLITE=ON
          -DWORM_WARNINGS_AS_ERRORS=ON
          -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake"

      - name: Configure
        if: runner.os != 'Windows'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER="${{ matrix.cc }}"
          -DCMAKE_CXX_COMPILER="${{ matrix.cxx }}"
          -DBUILD_TESTING=ON
          -DWORM_WARNINGS_AS_ERRORS=ON
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Run unit tests
        run: ctest --test-dir build -C Debug --output-on-failure

  driver-contracts:
    name: Driver contracts
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: worm_contract
          POSTGRES_USER: worm
          POSTGRES_PASSWORD: worm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U worm -d worm_contract"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: worm_contract
          MYSQL_USER: worm
          MYSQL_PASSWORD: worm
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      WORM_TEST_POSTGRES_HOST: 127.0.0.1
      WORM_TEST_POSTGRES_PORT: 5432
      WORM_TEST_POSTGRES_DBNAME: worm_contract
      WORM_TEST_POSTGRES_USERNAME: worm
      WORM_TEST_POSTGRES_PASSWORD: worm
      WORM_TEST_MYSQL_HOST: 127.0.0.1
      WORM_TEST_MYSQL_PORT: 3306
      WORM_TEST_MYSQL_DBNAME: worm_contract
      WORM_TEST_MYSQL_USERNAME: worm
      WORM_TEST_MYSQL_PASSWORD: worm

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install MySQL client development files
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf autoconf-archive automake default-libmysqlclient-dev libtool pkg-config

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh"

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DWORM_ENABLE_POSTGRESQL=ON
          -DWORM_ENABLE_MYSQL=ON
          -DWORM_ENABLE_SQLITE=ON
          -DBUILD_TESTING=ON
          -DWORM_WARNINGS_AS_ERRORS=ON
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build driver contracts
        run: >
          cmake --build build --config Debug --parallel --target
          WormSqliteDriverContractTests
          WormSqliteSchemaInspectorTests
          WormPostgresDriverContractTests
          WormMySqlDriverContractTests

      - name: Run driver contracts
        run: ctest --test-dir build -C Debug -L driver-contract --output-on-failure

  sanitizers:
    name: Sanitizers / ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux ASan + UBSan
            os: ubuntu-latest
            build-type: Debug
          - name: Windows ASan
            os: windows-latest
            build-type: RelWithDebInfo

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf autoconf-archive automake clang libtool

      - name: Bootstrap vcpkg
        if: runner.os == 'Linux'
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh"

      - name: Bootstrap vcpkg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat"

      - name: Configure
        if: runner.os == 'Linux'
        env:
          CC: clang
          CXX: clang++
        run: >
          cmake -S . -B build/sanitizers
          -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}
          -DBUILD_TESTING=ON
          -DWORM_BUILD_CLI=ON
          -DWORM_BUILD_EXAMPLES=ON
          -DWORM_ENABLE_POSTGRESQL=OFF
          -DWORM_ENABLE_MYSQL=OFF
          -DWORM_ENABLE_SQLITE=ON
          -DWORM_ENABLE_SANITIZERS=ON
          -DWORM_WARNINGS_AS_ERRORS=ON
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Configure
        if: runner.os == 'Windows'
        run: >
          cmake -S . -B build/sanitizers
          -DBUILD_TESTING=ON
          -DWORM_BUILD_CLI=ON
          -DWORM_BUILD_EXAMPLES=ON
          -DWORM_ENABLE_POSTGRESQL=OFF
          -DWORM_ENABLE_MYSQL=OFF
          -DWORM_ENABLE_SQLITE=ON
          -DWORM_ENABLE_SANITIZERS=ON
          -DWORM_WARNINGS_AS_ERRORS=ON
          -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build/sanitizers --config ${{ matrix.build-type }} --parallel

      - name: Add MSVC AddressSanitizer runtime to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $visualStudio = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.ASAN -property installationPath
          if (-not $visualStudio) {
            throw "Visual Studio with the AddressSanitizer component was not found."
          }

          $asanRuntime = Get-ChildItem `
            -Path "$visualStudio\VC\Tools\MSVC\*\bin\Hostx64\x64\clang_rt.asan_dynamic-x86_64.dll" `
            -File | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $asanRuntime) {
            throw "The MSVC AddressSanitizer runtime DLL was not found."
          }

          Add-Content -Path $env:GITHUB_PATH -Value $asanRuntime.DirectoryName

      - name: Run Linux sanitizer tests
        if: runner.os == 'Linux'
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build/sanitizers -C ${{ matrix.build-type }} --output-on-failure

      - name: Run Windows sanitizer tests
        if: runner.os == 'Windows'
        env:
          ASAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build/sanitizers -C ${{ matrix.build-type }} --output-on-failure

  coverage:
    name: Coverage / GCC
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf autoconf-archive automake gcovr g++ libtool

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh"

      - name: Configure
        env:
          CC: gcc
          CXX: g++
        run: >
          cmake -S . -B build/coverage
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DWORM_BUILD_CLI=ON
          -DWORM_BUILD_EXAMPLES=ON
          -DWORM_ENABLE_POSTGRESQL=OFF
          -DWORM_ENABLE_MYSQL=OFF
          -DWORM_ENABLE_SQLITE=ON
          -DWORM_ENABLE_COVERAGE=ON
          -DWORM_WARNINGS_AS_ERRORS=ON
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build/coverage --config Debug --parallel

      - name: Run tests
        run: ctest --test-dir build/coverage -C Debug --output-on-failure

      - name: Generate coverage report
        run: |
          mkdir -p build/coverage-report
          gcovr \
            --root . \
            --filter 'src/' \
            --filter 'cli/src/' \
            --exclude 'tests/' \
            --branches \
            --html-details build/coverage-report/index.html \
            --xml build/coverage-report/coverage.xml \
            --txt build/coverage-report/coverage.txt \
            --print-summary

          {
            echo '## Worm coverage'
            echo
            echo '```text'
            cat build/coverage-report/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: worm-coverage
          path: build/coverage-report
          if-no-files-found: error
          retention-days: 14

  optional-drivers:
    name: Optional drivers / ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no drivers
            cmake-options: >-
              -DWORM_ENABLE_POSTGRESQL=OFF
              -DWORM_ENABLE_MYSQL=OFF
              -DWORM_ENABLE_SQLITE=OFF
          - name: SQLite only
            cmake-options: >-
              -DWORM_ENABLE_POSTGRESQL=OFF
              -DWORM_ENABLE_MYSQL=OFF
              -DWORM_ENABLE_SQLITE=ON
              -DWORM_BUILD_EXAMPLES=ON
          - name: PostgreSQL only
            cmake-options: >-
              -DWORM_ENABLE_POSTGRESQL=ON
              -DWORM_ENABLE_MYSQL=OFF
              -DWORM_ENABLE_SQLITE=OFF
          - name: MySQL only
            cmake-options: >-
              -DWORM_ENABLE_POSTGRESQL=OFF
              -DWORM_ENABLE_MYSQL=ON
              -DWORM_ENABLE_SQLITE=OFF
          - name: MSSQL only
            cmake-options: >-
              -DWORM_ENABLE_POSTGRESQL=OFF
              -DWORM_ENABLE_MYSQL=OFF
              -DWORM_ENABLE_SQLITE=OFF
              -DWORM_ENABLE_MSSQL=ON

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Unix build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf autoconf-archive automake libtool

      - name: Install MySQL client development files
        if: matrix.name == 'MySQL only'
        run: |
          sudo apt-get install -y default-libmysqlclient-dev pkg-config

      - name: Install ODBC development files
        if: matrix.name == 'MSSQL only'
        run: |
          sudo apt-get install -y unixodbc-dev

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh"

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DWORM_WARNINGS_AS_ERRORS=ON
          ${{ matrix.cmake-options }}
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Run tests
        run: ctest --test-dir build -C Debug --output-on-failure
