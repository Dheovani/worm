name: Unit tests

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  unit-tests:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cxx: g++
          - os: ubuntu-latest
            compiler: clang
            cxx: clang++
          - os: windows-latest
            compiler: msvc
          - os: macos-latest
            compiler: appleclang
            cxx: clang++

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install MySQL client development files
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config

      - name: Install Clang
        if: runner.os == 'Linux' && matrix.compiler == 'clang'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Bootstrap vcpkg
        if: runner.os != 'Windows'
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh"

      - name: Bootstrap vcpkg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat"

      - name: Configure
        if: runner.os == 'Windows'
        run: >
          cmake -S . -B build
          -DBUILD_TESTING=ON
          -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake"

      - name: Configure
        if: runner.os != 'Windows'
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER="${{ matrix.cxx }}"
          -DBUILD_TESTING=ON
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Run unit tests
        run: ctest --test-dir build -C Debug --output-on-failure

  driver-contracts:
    name: Driver contracts
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: worm_contract
          POSTGRES_USER: worm
          POSTGRES_PASSWORD: worm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U worm -d worm_contract"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: worm_contract
          MYSQL_USER: worm
          MYSQL_PASSWORD: worm
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      WORM_TEST_POSTGRES_HOST: 127.0.0.1
      WORM_TEST_POSTGRES_PORT: 5432
      WORM_TEST_POSTGRES_DBNAME: worm_contract
      WORM_TEST_POSTGRES_USERNAME: worm
      WORM_TEST_POSTGRES_PASSWORD: worm
      WORM_TEST_MYSQL_HOST: 127.0.0.1
      WORM_TEST_MYSQL_PORT: 3306
      WORM_TEST_MYSQL_DBNAME: worm_contract
      WORM_TEST_MYSQL_USERNAME: worm
      WORM_TEST_MYSQL_PASSWORD: worm

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install MySQL client development files
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh"

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build driver contracts
        run: >
          cmake --build build --config Debug --parallel --target
          WormSqliteDriverContractTests
          WormPostgresDriverContractTests
          WormMySqlDriverContractTests

      - name: Run driver contracts
        run: ctest --test-dir build -C Debug -L driver-contract --output-on-failure

  optional-drivers:
    name: Optional drivers / ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no drivers
            cmake-options: >-
              -DWORM_ENABLE_POSTGRESQL=OFF
              -DWORM_ENABLE_MYSQL=OFF
              -DWORM_ENABLE_SQLITE=OFF
          - name: SQLite only
            cmake-options: >-
              -DWORM_ENABLE_POSTGRESQL=OFF
              -DWORM_ENABLE_MYSQL=OFF
              -DWORM_ENABLE_SQLITE=ON
              -DWORM_BUILD_EXAMPLES=ON
          - name: PostgreSQL only
            cmake-options: >-
              -DWORM_ENABLE_POSTGRESQL=ON
              -DWORM_ENABLE_MYSQL=OFF
              -DWORM_ENABLE_SQLITE=OFF
          - name: MySQL only
            cmake-options: >-
              -DWORM_ENABLE_POSTGRESQL=OFF
              -DWORM_ENABLE_MYSQL=ON
              -DWORM_ENABLE_SQLITE=OFF

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install MySQL client development files
        if: matrix.name == 'MySQL only'
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh"

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          ${{ matrix.cmake-options }}
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Run tests
        run: ctest --test-dir build -C Debug --output-on-failure
