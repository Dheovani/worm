name: Code quality

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  formatting:
    name: clang-format
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install clang-format
        run: |
          wget --quiet https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y clang-format-22

      - name: Check formatting
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA=$(git rev-list --max-parents=0 "$HEAD_SHA")
          fi

          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" -- src tests cli |
              grep -E '\.(cpp|hpp)$' || true
          )

          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No changed C++ files to check."
            exit 0
          fi

          clang-format-22 --dry-run --Werror "${files[@]}"

  static-analysis:
    name: clang-tidy
    runs-on: ubuntu-latest

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf autoconf-archive automake clang-tidy cmake default-libmysqlclient-dev g++ git libtool pkg-config

      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh"

      - name: Configure
        run: >
          cmake -S . -B build/quality
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DBUILD_TESTING=ON
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Run clang-tidy
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess

          compile_commands = pathlib.Path("build/quality/compile_commands.json")
          entries = json.loads(compile_commands.read_text())
          files = sorted({
              pathlib.Path(entry["file"]).resolve()
              for entry in entries
              if entry["file"].endswith(".cpp")
          })

          project_root = pathlib.Path.cwd().resolve()
          project_files = [
              str(file)
              for file in files
              if file.is_relative_to(project_root / "src") or file.is_relative_to(project_root / "tests")
          ]

          subprocess.run(["clang-tidy", "-p", "build/quality", *project_files], check=True)
          PY
