name: Code quality

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  formatting:
    name: clang-format
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18

      - name: Check formatting
        run: |
          mapfile -t files < <(git ls-files -- 'src' 'tests' | grep -E '\.(cpp|hpp)$')
          clang-format-18 --dry-run --Werror "${files[@]}"

  static-analysis:
    name: clang-tidy
    runs-on: ubuntu-latest

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy cmake default-libmysqlclient-dev g++ git pkg-config

      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh"

      - name: Configure
        run: >
          cmake -S . -B build/quality
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DBUILD_TESTING=ON
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Run clang-tidy
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess

          compile_commands = pathlib.Path("build/quality/compile_commands.json")
          entries = json.loads(compile_commands.read_text())
          files = sorted({
              pathlib.Path(entry["file"]).resolve()
              for entry in entries
              if entry["file"].endswith(".cpp")
          })

          project_root = pathlib.Path.cwd().resolve()
          project_files = [
              str(file)
              for file in files
              if file.is_relative_to(project_root / "src") or file.is_relative_to(project_root / "tests")
          ]

          subprocess.run(["clang-tidy", "-p", "build/quality", *project_files], check=True)
          PY
